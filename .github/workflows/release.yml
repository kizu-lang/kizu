# Release binaries are the Kizu compiler, built by the Go one from the tag,
# and they name their version (`kizu version`). A binary that says what it is
# cannot silently go stale the way an anonymous local build can.
#
# The Kizu backend links through the host clang, so there is no cross build:
# each target is built on a runner of that platform and the four artifacts are
# collected afterwards.
#
# The tarball layout is <prefix>/bin/kizu + <prefix>/lib/kizu, the same shape
# the binary resolves its library tree from and the same shape `nix build`
# installs.
name: release

# There is no x86_64 macOS build. Actions retired the macOS 13 image in
# December 2025 and its replacement is the last Intel one, gone in August
# 2027, so the target would be shipped on a runner that is already leaving.
# An Intel Mac builds from source.
#
# workflow_dispatch builds and smoke-tests the artifacts without publishing
# anything, so the path a tag takes has been walked before a tag takes it. It
# is also where linux-arm64 is exercised: CI runs macOS arm64 and Linux amd64,
# and this is the only place the third is built.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          KIZU_LIB_DIR: ${{ github.workspace }}/lib/kizu
          # A tag names the release; a dry run carries no version and the
          # binary names itself by the VCS state, the way a local build does.
          KIZU_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -eu
          clang --version | head -1
          # The seed compiles the Kizu compiler and is not shipped.
          go build -trimpath -o seed/kizu ./cmd/kizu
          # The released binary has no linker flag to stamp, so the version it
          # names is generated with it, from the tag this release is cut from.
          go run -ldflags \
            "-X github.com/kizu-lang/kizu/internal/version.Release=$KIZU_RELEASE" \
            ./scripts/gen-selfhost-version
          prefix="dist/kizu-${KIZU_RELEASE:-devel}-${{ matrix.target }}"
          mkdir -p "$prefix/bin" "$prefix/lib"
          ./seed/kizu build --target native --opt -o "$prefix/bin/kizu" compiler
          cp -R lib/kizu "$prefix/lib/kizu"
          tar -C dist -czf "$prefix.tar.gz" "$(basename "$prefix")"
      - name: Smoke
        env:
          KIZU_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -eu
          # From an unrelated directory with nothing pointing at a library
          # tree: what a user gets after extracting the tarball.
          prefix="$PWD/dist/kizu-${KIZU_RELEASE:-devel}-${{ matrix.target }}"
          cd "$(mktemp -d)"
          "$prefix/bin/kizu" version
          "$prefix/bin/kizu" run "$GITHUB_WORKSPACE/examples/hello.kizu"
      - uses: actions/upload-artifact@v4
        with:
          name: kizu-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    # A dry run stops after the artifacts are built and smoke-tested.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --repo "$GITHUB_REPOSITORY"
