# Release binaries are built from the tag and name their version
# (`kizu version`). A binary that says what it is cannot silently go stale
# the way an anonymous local build can.
#
# The tarball layout is <prefix>/bin/kizu + <prefix>/lib/kizu, the same shape
# the binary resolves its library tree from and the same shape `nix build`
# installs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${target%-*}"
            arch="${target#*-}"
            prefix="dist/kizu-${GITHUB_REF_NAME}-${target}"
            mkdir -p "$prefix/bin" "$prefix/lib"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-X main.version=${GITHUB_REF_NAME}" \
              -o "$prefix/bin/kizu" ./cmd/kizu
            cp -R lib/kizu "$prefix/lib/kizu"
            tar -C dist -czf "$prefix.tar.gz" "$(basename "$prefix")"
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
