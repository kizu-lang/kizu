# main は green のみ。全ての gate を push/PR ごとに回す。
#
# 定時実行(nightly)は置かない。壊れたことに翌朝まで気づけない仕組みは、
# 気づける仕組みより弱い。gate は速く保ち、PR のたびに全部通す。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Named by platform alone: the required checks on main go by these names,
    # and a matrix field would otherwise become part of them.
    name: test (${{ matrix.os }})
    # The toolchain links through the host clang, so the gates say nothing
    # about a platform they never ran on. Both build and test the compiler.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The IR runtime replay tests in compiler/ execute wasm under node's WASI
      # runtime. The version is pinned instead of taking the image's default:
      # node 22.23.4 segfaults on those workloads (reproduced on a real Mac
      # with the same version; 20.19.5 and 26.12.1 run them clean), and an
      # undeclared tool dependency should not drift with the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore Kizu build cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/kizu-cache
          key: kizu-${{ runner.os }}-${{ runner.arch }}-v1-${{ github.sha }}
          restore-keys: |
            kizu-${{ runner.os }}-${{ runner.arch }}-v1-
      # The seed release pinned in scripts/seed.txt checks and tests compiler/
      # and builds stage1; stage1 checks and tests compiler/, runs the test
      # harness, and builds stage2, which has to rebuild itself byte for byte.
      - name: Bootstrap from the seed
        env:
          KIZU_CACHE_DIR: ${{ runner.temp }}/kizu-cache
        run: scripts/bootstrap.sh

  difftest-direct:
    # The direct backend is the default of build, run and test where the
    # target has it, so the test job already runs it on compiler/ and the
    # test cases; this job holds it to LLVM on every `run` example. It is a
    # job of its own so that it runs beside the test job instead of after it,
    # and not a required check. It runs on Linux x86_64: there the examples
    # take a couple of minutes, while on macOS every fresh binary is slow to
    # link and to start and they take about as long as the bootstrap. The
    # Mach-O side is held by the macOS test job, whose runs are direct.
    name: difftest-direct (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build stage1 from the seed
        run: scripts/bootstrap.sh --stage1-only
      - name: Direct backend against LLVM on the examples
        run: scripts/difftest-direct.sh target/seed/stage1/bin/kizu
