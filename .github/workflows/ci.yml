# ADR-0082: main は green のみ。全ての gate を push/PR ごとに回す。
#
# 定時実行(nightly)は置かない。壊れたことに翌朝まで気づけない仕組みは、
# 気づける仕組みより弱い。gate は速く保ち、PR のたびに全部通す。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -count=1 -timeout=15m
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
