# ADR-0080/0081: main は green のみ。push/PR ごとに daily suite、nightly に
# stage0-native ビルドと hosted parity gate を回す。
#
# ADR-0081 で自己コンパイル backend を撤去したので、nightly が確認するのは
# 「Go backend(stage0)が selfhost をコンパイルでき、その実行ファイルが Go と
# 同じ答えを返すこと」であって、selfhost 自身のコンパイル能力ではない。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly (JST 03:00)
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Daily suite
        run: go test ./... -count=1 -timeout=20m
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

  nightly-parity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build selfhost natively (stage0)
        run: >
          go run ./cmd/kizu build --target native --opt --libc on
          --runtime hosted --emit exe --linker clang
          -o target/selfhost/stage0-native/selfhost selfhost
      - name: Parity gates
        run: |
          KIZU_RUN_SELFHOST_PRODUCTION=1 go test -timeout=20m ./cmd/kizu -run 'TestSelfhostProductionBoundaryGate$' -count=1
          KIZU_RUN_SELFHOST_CHECK_PARITY=1 go test -timeout=20m ./cmd/kizu -run 'TestSelfhostCheckParityGate$' -count=1
          KIZU_RUN_SELFHOST_PARSE_PARITY=1 go test -timeout=20m ./cmd/kizu -run 'TestSelfhostParseParityGate$' -count=1
          KIZU_RUN_SELFHOST_FMT_PARITY=1 go test -timeout=20m ./cmd/kizu -run 'TestSelfhostFmtParityGate$' -count=1
          KIZU_RUN_SELFHOST_RUN_PARITY=1 go test -timeout=30m ./cmd/kizu -run 'TestSelfhostRunParityGate$' -count=1
          KIZU_RUN_SELFHOST_TEST_PARITY=1 go test -timeout=20m ./cmd/kizu -run 'TestSelfhostTestParityGate$' -count=1
          KIZU_RUN_SELFHOST_CORPUS=1 go test -timeout=20m ./cmd/kizu -run 'TestSelfhostSupportedCorpusGate$' -count=1
