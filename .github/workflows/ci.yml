# main は green のみ。全ての gate を push/PR ごとに回す。
#
# 定時実行(nightly)は置かない。壊れたことに翌朝まで気づけない仕組みは、
# 気づける仕組みより弱い。gate は速く保ち、PR のたびに全部通す。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Named by platform alone: the required checks on main go by these names,
    # and the matrix's second field would otherwise become part of them.
    name: test (${{ matrix.os }})
    # The toolchain links through the host clang, so the gates say nothing
    # about a platform they never ran on. Both are built and tested.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            packages: ./...
          # The Kizu compiler's own tests (internal/selfhost) compare the text
          # its front end writes with what the Go seed wrote, and that text
          # does not depend on the host. One platform runs them; the slower
          # runner is spared the longest package, and still builds and runs
          # the compiler itself through cmd/kizu.
          - os: ubuntu-latest
            packages: $(go list ./... | grep -v /internal/selfhost)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The internal/ir replay tests execute wasm under node's WASI runtime.
      # The version is pinned instead of taking the image's default: node
      # 22.23.4 segfaults on those workloads (reproduced on a real Mac with
      # the same version; 20.19.5 and 26.12.1 run them clean), and an
      # undeclared tool dependency should not drift with the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore selfhost compiler
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/selfhost
          key: selfhost-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('go.mod', 'go.sum', 'cmd/kizu/**', 'internal/**', 'compiler/**', 'lib/kizu/std/**') }}
      - name: Restore Kizu build cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/kizu-cache
          key: kizu-${{ runner.os }}-${{ runner.arch }}-v1-${{ github.sha }}
          restore-keys: |
            kizu-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Test
        env:
          KIZU_CACHE_DIR: ${{ runner.temp }}/kizu-cache
          KIZU_TEST_SELFHOST: ${{ runner.temp }}/selfhost/kizu
        run: go test ${{ matrix.packages }} -count=1 -timeout=15m
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

  # compiler/ built without Go: the seed release pinned in scripts/seed.txt
  # checks and tests it, builds stage1, and stage1 checks and tests it again.
  # A pull request only checks with both, to keep its wait short; a push to
  # main runs the tests too.
  # A job of its own so the required test checks keep their names and their
  # length. compiler/ is the same text on every host, so whether the seed can
  # build it is asked once, on Linux.
  seed:
    name: seed (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap from the seed
        env:
          KIZU_CACHE_DIR: ${{ runner.temp }}/kizu-cache
        run: scripts/bootstrap.sh ${{ github.event_name == 'pull_request' && '--check-only' || '' }}
