name: contribution-guard

# Closes and locks pull requests and issues from outside the project, and
# redirects external feedback to GitHub Discussions.
#
# pull_request_target runs this file as it is on the base branch, so a pull
# request cannot edit its own guard. That event also carries a write token, so
# this job reads nothing from the pull request head and never checks out code.
# Untrusted event fields (titles, bodies, filenames, author names) are never
# printed to stdout, where the runner would read them as workflow commands.
on:
  pull_request_target:
    types: [opened, reopened]
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Enforce maintainer-only PRs and issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        run: |
          set -euo pipefail

          # Allow automated workflow runs (such as difftest-nightly.yml).
          if [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo 'Allowed automated workflow actor.'
            exit 0
          fi

          # author_association reads a private organization member as an
          # outsider, so ask what the author may do to the repository instead.
          # An answer that does not come back is treated as no access.
          case "$AUTHOR" in
            '' | *[!A-Za-z0-9_-]*)
              permission=none
              ;;
            *)
              permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || echo none)"
              ;;
          esac

          case "$permission" in
            admin | maintain | write)
              echo 'The author can push to this repository, so there is nothing to check.'
              exit 0
              ;;
          esac

          case "$NUMBER" in
            '' | *[!0-9]*)
              echo 'Missing or invalid issue or pull request number.' >&2
              exit 1
              ;;
          esac

          comment="$(cat <<'EOF'
          Thank you for your interest in Kizu.

          Kizu is currently maintained solely by the author, and external pull requests and issues are not accepted. This thread has been closed automatically.

          For questions, bug reports, or ideas, please use [GitHub Discussions](https://github.com/kizu-lang/kizu/discussions).

          ---

          Kizu に関心をお寄せいただきありがとうございます。

          現在 Kizu は作者のみで保守しており、外部からの pull request および issue は受け付けていません。このスレッドは自動的にクローズされました。

          質問・不具合報告・アイデアなどは [GitHub Discussions](https://github.com/kizu-lang/kizu/discussions) にお寄せください。
          EOF
          )"

          case "$EVENT_NAME" in
            pull_request_target)
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$comment" --silent
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" -f state=closed --silent
              gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$NUMBER/lock" --silent
              echo 'Closed and locked external pull request.'
              ;;
            issues)
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$comment" --silent
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$NUMBER" -f state=closed -f state_reason=not_planned --silent
              gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$NUMBER/lock" --silent
              echo 'Closed and locked external issue.'
              ;;
            *)
              echo 'Unsupported event.' >&2
              exit 1
              ;;
          esac
