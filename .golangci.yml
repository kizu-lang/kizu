run:
  timeout: 2m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gocyclo
    - gofmt
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: duplicated-imports
      - name: early-return
      - name: error-naming
      - name: error-return
      - name: indent-error-flow
      - name: range
      - name: receiver-naming
      - name: unreachable-code
      - name: unused-parameter

issues:
  exclude-dirs:
    - .direnv
