# The commit hook is the fast one: the pinned seed and the stage1 it builds
# check compiler/ in a few seconds. The tests are the slow part -- compiler/'s
# own, the test harness and the self-rebuild -- so they run on push, where
# waiting is worth it. Both are scripts/bootstrap.sh, the form CI runs.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # The shipping compiler is the Kizu one under compiler/. The check
      # catches a compiler that no longer builds, or that the seed can no
      # longer build, before the commit.
      - id: selfhost
        name: selfhost check
        entry: scripts/bootstrap.sh --check-only
        language: system
        pass_filenames: false
        always_run: true

      - id: bootstrap
        name: bootstrap
        entry: scripts/bootstrap.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
