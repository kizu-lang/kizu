# The commit hooks are the fast ones: gofmt, golangci-lint, the comment check and the
# Kizu compiler's own check run in a few seconds together. go test is the slow one -- most
# of it is cmd/kizu, which builds and runs the compiler, and internal/selfhost, which runs
# the Kizu compiler's tests -- so it runs on push, where waiting is worth it.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        pass_filenames: false
        always_run: true

      - id: go-comments
        name: go comments
        entry: ./scripts/check-go-comments.sh
        language: system
        pass_filenames: false
        always_run: true

      # The shipping compiler is the Kizu one under compiler/. Its check is a
      # second's work and catches a compiler that no longer builds before the
      # commit; its tests take a minute and run with go test (internal/selfhost).
      - id: selfhost
        name: selfhost check
        entry: sh -c 'go run ./scripts/gen-selfhost-version && go run ./cmd/kizu check compiler'
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
