# The commit hook is the fast one: the pinned seed and the stage1 it builds
# check compiler/ in a few seconds. The tests are the slow part -- compiler/'s
# own, the test harness and the self-rebuild -- so they run on push, where
# waiting is worth it. Both are scripts/bootstrap.sh, the form CI runs.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # compiler/src and lib/kizu/std carry no explanatory comments (AGENTS.md).
      # A line-start `//` or a trailing `//` fails; `///` and `// SAFETY:`
      # pass, because the compiler asks for them on unsafe code. `//` inside
      # a "..." string or a `\\` multiline string is not a comment.
      # exclude lists the directories whose comments are not removed yet:
      # the PR that empties one drops its line. Every line ends in `|` so
      # any line can go alone.
      - id: no-code-comments
        name: no comments in compiler/src and lib/kizu/std
        language: pygrep
        entry: '^[ \t]*//(?!/(?!/)|[ \t]*SAFETY:)|^[ \t]*(?=[^ \t/\n]|/(?!/))(?:[^"/\\\n]|"[^"\n]*"|/(?!/)|\\(?!\\))*//(?![ \t]*SAFETY:)'
        files: ^(compiler/src|lib/kizu/std)/.*\.kizu$
        exclude: |
          (?x)^(
          compiler/src/[^/]+|
          compiler/src/internal/ast/[^/]+|
          compiler/src/internal/buildcache/[^/]+|
          compiler/src/internal/cimport/[^/]+|
          compiler/src/internal/diagnostic/[^/]+|
          compiler/src/internal/fmt/[^/]+|
          compiler/src/internal/fsutil/[^/]+|
          compiler/src/internal/hostabi/[^/]+|
          compiler/src/internal/lexer/[^/]+|
          compiler/src/internal/llvm/[^/]+|
          compiler/src/internal/manifest/[^/]+|
          compiler/src/internal/native/[^/]+|
          compiler/src/internal/ownership/[^/]+|
          compiler/src/internal/parser/[^/]+|
          compiler/src/internal/pool/[^/]+|
          compiler/src/internal/project/[^/]+|
          compiler/src/internal/sha256/[^/]+|
          compiler/src/internal/source/[^/]+|
          compiler/src/internal/staticexpr/[^/]+|
          compiler/src/internal/stdfmt/[^/]+|
          compiler/src/internal/stdmath/[^/]+|
          compiler/src/internal/stdmeta/[^/]+|
          compiler/src/internal/stdmethod/[^/]+|
          compiler/src/internal/stdprim/[^/]+|
          compiler/src/internal/stdtarget/[^/]+|
          compiler/src/internal/token/[^/]+|
          compiler/src/internal/typ/[^/]+|
          compiler/src/internal/types/[^/]+|
          compiler/src/internal/unsafecap/[^/]+|
          compiler/src/internal/wasm/[^/]+|
          lib/kizu/std/src/arena/[^/]+|
          lib/kizu/std/src/array/[^/]+|
          lib/kizu/std/src/compress/[^/]+|
          lib/kizu/std/src/coro/[^/]+|
          lib/kizu/std/src/crypto/[^/]+|
          lib/kizu/std/src/crypto/x509/[^/]+|
          lib/kizu/std/src/date/[^/]+|
          lib/kizu/std/src/float/[^/]+|
          lib/kizu/std/src/fmt/[^/]+|
          lib/kizu/std/src/fs/[^/]+|
          lib/kizu/std/src/http/[^/]+|
          lib/kizu/std/src/internal/builtin/[^/]+|
          lib/kizu/std/src/io/[^/]+|
          lib/kizu/std/src/json/[^/]+|
          lib/kizu/std/src/machine/[^/]+|
          lib/kizu/std/src/map/[^/]+|
          lib/kizu/std/src/math/[^/]+|
          lib/kizu/std/src/mem/[^/]+|
          lib/kizu/std/src/net/[^/]+|
          lib/kizu/std/src/path/[^/]+|
          lib/kizu/std/src/process/[^/]+|
          lib/kizu/std/src/rand/[^/]+|
          lib/kizu/std/src/sort/[^/]+|
          lib/kizu/std/src/string/[^/]+|
          lib/kizu/std/src/testing/[^/]+|
          lib/kizu/std/src/thread/[^/]+|
          lib/kizu/std/src/time/[^/]+|
          lib/kizu/std/src/tls/[^/]+|
          )$

      # The shipping compiler is the Kizu one under compiler/. The check
      # catches a compiler that no longer builds, or that the seed can no
      # longer build, before the commit.
      - id: selfhost
        name: selfhost check
        entry: scripts/bootstrap.sh --check-only
        language: system
        pass_filenames: false
        always_run: true

      - id: bootstrap
        name: bootstrap
        entry: scripts/bootstrap.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
