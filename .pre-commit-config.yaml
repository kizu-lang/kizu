# The commit hook is the fast one: the pinned seed and the stage1 it builds
# check compiler/ in a few seconds. The tests are the slow part -- compiler/'s
# own, the test harness and the self-rebuild -- so they run on push, where
# waiting is worth it. Both are scripts/bootstrap.sh, the form CI runs.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # compiler/src and lib/kizu/std carry no explanatory comments (AGENTS.md).
      # `///` and `// SAFETY:` pass, because the compiler asks for them on
      # unsafe code; in lib/kizu/std a `//` block right above a pub
      # declaration or a public type's method passes as its contract.
      # scripts/comment-lint/check.py defines the rule and
      # scripts/comment-lint/test.py pins it.
      # exclude lists the directories whose comments are not removed yet:
      # the PR that empties one drops its line. Every line ends in `|` so
      # any line can go alone.
      - id: no-code-comments
        name: no comments in compiler/src and lib/kizu/std
        language: python
        entry: python scripts/comment-lint/check.py
        files: ^(compiler/src|lib/kizu/std)/.*\.kizu$
        exclude: |
          (?x)^(
          lib/kizu/std/src/compress/[^/]+|
          lib/kizu/std/src/crypto/aes\.kizu|
          lib/kizu/std/src/crypto/gcm\.kizu|
          lib/kizu/std/src/http/[^/]+|
          lib/kizu/std/src/json/[^/]+|
          lib/kizu/std/src/math/[^/]+|
          lib/kizu/std/src/net/[^/]+|
          lib/kizu/std/src/tls/[^/]+|
          )$

      - id: comment-lint-test
        name: comment lint tests
        language: python
        entry: python scripts/comment-lint/test.py
        files: ^scripts/comment-lint/
        pass_filenames: false

      # The shipping compiler is the Kizu one under compiler/. The check
      # catches a compiler that no longer builds, or that the seed can no
      # longer build, before the commit.
      - id: selfhost
        name: selfhost check
        entry: scripts/bootstrap.sh --check-only
        language: system
        pass_filenames: false
        always_run: true

      - id: bootstrap
        name: bootstrap
        entry: scripts/bootstrap.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
