# The commit hooks are the fast ones: gofmt, golangci-lint and the comment check run in a
# few seconds together. go test is the slow one -- most of it is cmd/kizu, which builds and
# runs the compiler -- so it runs on push, where waiting is worth it.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        pass_filenames: false
        always_run: true

      - id: go-comments
        name: go comments
        entry: ./scripts/check-go-comments.sh
        language: system
        pass_filenames: false
        always_run: true

      # The shipping compiler is the Kizu one under compiler/, and its own test
      # blocks are Kizu sources that `go test` never runs. This is the only gate
      # that checks it still builds and that those tests pass.
      - id: selfhost
        name: selfhost check
        entry: sh -c 'go run ./scripts/gen-selfhost-version && go run ./cmd/kizu check compiler && go run ./cmd/kizu test compiler'
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
